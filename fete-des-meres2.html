<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonne Fête des Mères 💐</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#e8f0eb;
  font-family:'Playfair Display',Georgia,serif;
  overflow:hidden;
  height:100vh;
  width:100vw;
}

/* ── ÉCRAN PRÉNOM ── */
#screen-name{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:#e8f0eb;
  z-index:100;
  transition:opacity 0.8s;
}
#screen-name h1{
  font-family:'Dancing Script',cursive;
  font-size:clamp(2rem,5vw,3.2rem);
  color:#5a7a60;
  margin-bottom:0.4rem;
  text-align:center;
}
#screen-name p{
  color:#7a9a80;font-style:italic;
  margin-bottom:2rem;font-size:1.1rem;
  text-align:center;
}
#name-input{
  padding:0.8rem 1.6rem;
  border:2px solid #a8c8b0;
  border-radius:50px;
  font-family:'Playfair Display',serif;
  font-size:1.2rem;
  background:white;
  color:#3a5a40;
  outline:none;
  text-align:center;
  width:280px;
  transition:border-color 0.3s,box-shadow 0.3s;
}
#name-input:focus{border-color:#6a9a70;box-shadow:0 0 0 3px rgba(106,154,112,0.2);}
#btn-start{
  margin-top:1rem;
  padding:0.8rem 2.2rem;
  background:#6a9a70;
  color:white;border:none;
  border-radius:50px;
  font-family:'Dancing Script',cursive;
  font-size:1.3rem;
  cursor:pointer;
  transition:transform 0.2s,background 0.2s;
  box-shadow:0 4px 18px rgba(106,154,112,0.35);
}
#btn-start:hover{background:#5a8a60;transform:translateY(-2px);}

/* ── CANVAS PRINCIPAL ── */
#main-canvas{
  position:fixed;inset:0;
  display:none;
}

/* ── TEXTE POÈME ── */
#poem-container{
  position:fixed;
  right:0;top:0;bottom:0;
  width:38%;
  display:none;
  flex-direction:column;
  justify-content:center;
  padding:2rem 2.5rem 2rem 1.5rem;
  overflow:hidden;
}
#poem-name{
  font-family:'Dancing Script',cursive;
  font-size:clamp(1.8rem,3vw,2.8rem);
  color:#c85a6a;
  margin-bottom:0.8rem;
  opacity:0;
  transition:opacity 1s;
}
#poem-text{
  font-size:clamp(0.82rem,1.2vw,1.05rem);
  line-height:1.9;
  color:#3a5a40;
  white-space:pre-wrap;
  font-style:italic;
}
#poem-text .highlight{color:#c85a6a;font-style:normal;font-weight:700;}



/* ── LOADING IA ── */
#ai-loading{
  position:fixed;inset:0;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  background:#e8f0eb;z-index:99;
}
#ai-loading p{color:#5a7a60;font-style:italic;font-size:1.1rem;margin-top:1rem;}
.spinner{
  width:38px;height:38px;
  border:3px solid #a8c8b0;
  border-top-color:#6a9a70;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:700px){
  #poem-container{
    width:100%;top:auto;
    bottom:0;height:42vh;
    padding:1rem 1.2rem;
    background:rgba(232,240,235,0.92);
    backdrop-filter:blur(6px);
  }
  #main-canvas{width:100%;height:58vh;bottom:42vh;top:0;}
}
</style>
</head>
<body>

<!-- MUSIQUE AUTO -->
<audio id="bg-music" loop preload="auto">
  <source src="Omah_Lay_I_m_a_mess_Lyrics_Choir_version_Urban_chords256k.mp3" type="audio/mpeg">
</audio>

<!-- ÉCRAN SAISIE PRÉNOM -->
<div id="screen-name">
  <p>by ASSANDE JUNIOR</p>
  <div style="font-size:3rem;margin-bottom:1rem;">❤️</div>
  <h1>Bonne Fête des Mères</h1>
  <p>NOUS T'AIMONS FORT MAMAN</p>
  <input id="name-input" type="text" placeholder="Prénom de maman…" maxlength="24" autocomplete="off"/>
  <button id="btn-start" onclick="demarrer()">VOIR LA SURPRISE✨</button>
</div>

<!-- LOADING IA -->
<div id="ai-loading">
  <div class="spinner"></div>
  <p>Génération du poème en cours…</p>
</div>

<!-- CANVAS ANIMATION -->
<canvas id="main-canvas"></canvas>

<!-- TEXTE POÈME -->
<div id="poem-container">
  <div id="poem-name"></div>
  <div id="poem-text"></div>
</div>



<script>
// Tentative autoplay au chargement
window.addEventListener('load', ()=>{
  const music = document.getElementById('bg-music');
  music.volume = 0.5;
  music.play().catch(()=>{}); // silencieux si bloqué par le navigateur
});

// ══════════════════════════════════════════
// ÉTAT GLOBAL
// ══════════════════════════════════════════
let userName = '';
let poemLines = [];
let canvas, ctx, W, H;

// Arbre
let treeProgress = 0;       // 0→1
let treePhase = false;

// Particules cœur
let particles = [];
let heartPoints = [];
let particlePhase = false;
let heartFormed = false;

// Texte
let typePhase = false;
let typeCharIndex = 0;
let typeLine = 0;
let typeTimer = null;
let fullText = '';

// Compteur
let counterPhase = false;
let startDate = new Date();
startDate.setMonth(startDate.getMonth() - 6); // 6 mois par défaut

// ══════════════════════════════════════════
// DÉMARRAGE
// ══════════════════════════════════════════
async function demarrer(){
  userName = document.getElementById('name-input').value.trim();
  if(!userName){ 
    document.getElementById('name-input').style.borderColor='#c85a6a';
    return;
  }
  // Lancer la musique dès le clic (autoplay autorisé après interaction)
  const music = document.getElementById('bg-music');
  music.volume = 0.5;
  music.play().catch(()=>{});
  // Poème instantané (pas d'IA, pas de chargement)
  poemLines = getPoemeChrétien(userName);

  // Transition douce puis lancer animation
  document.getElementById('screen-name').style.opacity='0';
  setTimeout(()=>{
    document.getElementById('screen-name').style.display='none';
    initAnimation();
  },500);
}

document.getElementById('name-input').addEventListener('keydown',e=>{if(e.key==='Enter')demarrer();});

// ══════════════════════════════════════════
// POÈME CHRÉTIEN FIXE (personnalisé avec le prénom)
// ══════════════════════════════════════════
async function genererPoeme(prenom){
  // Pas d'appel IA : on retourne directement le poème fixe
  return getPoemeChrétien(prenom).join('\n');
}

function fallbackPoem(n){
  return getPoemeChrétien(n);
}

function getPoemeChrétien(n){
  return [
    `Maman ${n}, Dieu t'a choisie avant même l'aurore,`,
    `Pour porter dans tes bras le don de la vie,`,
    `Comme Marie tint l'Enfant qu'Elle adore,`,
    `Tu nous as enveloppés de ta grâce infinie.`,
    ``,
    `Tes mains sont celles que le Seigneur a bénies,`,
    `Pour essuyer nos pleurs, guider nos premiers pas,`,
    `Maman ${n}, dans ton amour se reflète ta tendresse,`,
    `Un amour qui jamais ne s'efface et ne s'épuise ici-bas.`,
    ``,
    `Tu nous as appris à lever les yeux vers le ciel,`,
    `À prier le matin, à rendre grâce le soir,`,
    `Par toi nous avons goûté l'amour éternel,`,
    `Et compris que la foi est notre plus grand avoir.`,
    ``,
    `Comme le Psaume chante la bonté du Seigneur,`,
    `Ta vie entière est un cantique d'espérance,`,
    `Maman ${n}, tu es le reflet de Sa lumière et Sa douceur,`,
    `Un trésor que le ciel nous a donné en abondance.`,
    ``,
    `Bonne fête, Maman ${n}!`,
  ];
}

// ══════════════════════════════════════════
// INIT CANVAS + SÉQUENCE
// ══════════════════════════════════════════
function initAnimation(){
  canvas = document.getElementById('main-canvas');
  canvas.style.display='block';
  resize();
  window.addEventListener('resize', resize);

  // Préparer points cœur
  heartPoints = buildHeartPoints();

  // Créer particules (invisibles au départ)
  for(let i=0;i<350;i++){
    particles.push(createParticle(i));
  }

  // Lancer séquence
  treePhase = true;
  requestAnimationFrame(loop);

  // Après arbre complet → particules
  setTimeout(()=>{
    treePhase = false;
    particlePhase = true;
  }, 3200);

  // Après cœur formé → texte
  setTimeout(()=>{
    particlePhase = false;
    heartFormed = true;
    showPoem();
  }, 7000);


}

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  heartPoints = buildHeartPoints();
}

// ══════════════════════════════════════════
// LOOP PRINCIPAL
// ══════════════════════════════════════════
function loop(){
  ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#e8f0eb';
  ctx.fillRect(0,0,W,H);

  drawTree();

  if(particlePhase || heartFormed){
    updateParticles();
    drawParticles();
  }

  requestAnimationFrame(loop);
}

// ══════════════════════════════════════════
// ARBRE SVG-style sur Canvas
// ══════════════════════════════════════════
const TREE_ORIGIN_X_RATIO = 0.28; // 28% depuis gauche (62% canvas)
const TREE_ORIGIN_Y_RATIO = 0.95;

function drawTree(){
  if(treePhase && treeProgress < 1){
    treeProgress = Math.min(1, treeProgress + 0.006);
  }
  if(treeProgress <= 0) return;

  const ox = W * TREE_ORIGIN_X_RATIO;
  const oy = H * TREE_ORIGIN_Y_RATIO;
  const trunkH = H * 0.38;

  ctx.save();
  ctx.strokeStyle = '#2a1a10';
  ctx.lineCap = 'round';

  // Tronc
  const trunkProgress = Math.min(1, treeProgress / 0.25);
  ctx.lineWidth = 14;
  ctx.beginPath();
  ctx.moveTo(ox, oy);
  ctx.lineTo(ox, oy - trunkH * trunkProgress);
  ctx.stroke();

  if(treeProgress > 0.25){
    const branchP = (treeProgress - 0.25) / 0.75;
    drawBranches(ox, oy - trunkH, trunkH * 0.55, -Math.PI/2, 10, 5, branchP);
  }

  ctx.restore();
}

function drawBranches(x, y, len, angle, width, depth, progress){
  if(depth === 0 || len < 4 || progress <= 0) return;
  const endX = x + Math.cos(angle) * len * Math.min(1, progress * (6 - depth + 1) / 1);
  const endY = y + Math.sin(angle) * len * Math.min(1, progress * (6 - depth + 1) / 1);
  ctx.lineWidth = Math.max(1, width);
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(endX, endY);
  ctx.stroke();
  const nextP = Math.max(0, progress - 0.18);
  if(progress > 0.18){
    drawBranches(endX, endY, len * 0.68, angle - 0.45, width * 0.65, depth-1, nextP);
    drawBranches(endX, endY, len * 0.68, angle + 0.45, width * 0.65, depth-1, nextP);
    if(depth > 3){
      drawBranches(endX, endY, len * 0.5, angle - 0.9, width * 0.5, depth-2, nextP * 0.7);
      drawBranches(endX, endY, len * 0.5, angle + 0.9, width * 0.5, depth-2, nextP * 0.7);
    }
  }
}

// ══════════════════════════════════════════
// PARTICULES CŒUR
// ══════════════════════════════════════════
const COLORS = ['#e84393','#ff6b8a','#ff9050','#ffd060','#c060e0','#ff4466','#ff7eb0','#ffb347'];

function buildHeartPoints(){
  const pts = [];
  // Centre du cœur: autour du centre-gauche du canvas (côté arbre)
  const cx = W * 0.28;
  const cy = H * 0.42;
  const size = Math.min(W, H) * 0.22;
  const count = 350;
  for(let i=0;i<count;i++){
    const t = (i/count) * 2 * Math.PI;
    // Équation paramétrique du cœur
    const hx = 16 * Math.pow(Math.sin(t),3);
    const hy = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
    pts.push({
      x: cx + hx * (size/16),
      y: cy + hy * (size/16)
    });
  }
  return pts;
}

function createParticle(i){
  return {
    x: Math.random() * W,
    y: Math.random() * H,
    vx: (Math.random()-0.5)*2,
    vy: (Math.random()-0.5)*2,
    color: COLORS[Math.floor(Math.random()*COLORS.length)],
    size: 6 + Math.random()*6,
    targetIndex: i % heartPoints.length,
    alpha: Math.random() * 0.6 + 0.4,
    gathered: false,
    wobble: Math.random()*Math.PI*2,
    wobbleSpeed: 0.02 + Math.random()*0.03
  };
}

function updateParticles(){
  particles.forEach((p,i)=>{
    p.wobble += p.wobbleSpeed;
    if(particlePhase){
      // Converger vers la cible
      const target = heartPoints[p.targetIndex];
      if(!target) return;
      const dx = target.x - p.x;
      const dy = target.y - p.y;
      const dist = Math.sqrt(dx*dx+dy*dy);
      if(dist < 4){
        p.gathered = true;
        p.x = target.x;
        p.y = target.y;
      } else {
        const speed = Math.min(0.12, 0.04 + (1 - dist/Math.max(W,H)));
        p.x += dx * speed;
        p.y += dy * speed;
      }
    } else if(heartFormed){
      // Flotter doucement autour de la cible
      const target = heartPoints[p.targetIndex];
      if(!target) return;
      p.x = target.x + Math.sin(p.wobble) * 3;
      p.y = target.y + Math.cos(p.wobble * 0.7) * 3;
    } else {
      // Mouvement libre
      p.x += p.vx;
      p.y += p.vy;
      if(p.x<0||p.x>W) p.vx*=-1;
      if(p.y<0||p.y>H) p.vy*=-1;
    }
  });
}

function drawParticles(){
  particles.forEach(p=>{
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.font = `${p.size}px serif`;
    ctx.fillStyle = p.color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('♥', p.x, p.y);
    ctx.restore();
  });
}

// ══════════════════════════════════════════
// POÈME TYPEWRITER
// ══════════════════════════════════════════
function showPoem(){
  const pc = document.getElementById('poem-container');
  const pn = document.getElementById('poem-name');
  pc.style.display = 'flex';

  // Nom avec animation
  pn.textContent = `Pour toi, Maman ${userName} 💐`;
  setTimeout(()=>{ pn.style.opacity='1'; }, 200);

  // Construire le texte complet
  fullText = poemLines.join('\n');

  // Typewriter
  setTimeout(()=>{
    typewriterStart();
  }, 800);
}

function typewriterStart(){
  const el = document.getElementById('poem-text');
  el.innerHTML = '';
  let charIndex = 0;
  const chars = fullText.split('');

  function typeNext(){
    if(charIndex >= chars.length) return;
    const ch = chars[charIndex];
    // Ajouter le caractère avec highlight du prénom
    const span = document.createElement('span');
    span.textContent = ch;
    el.appendChild(span);
    charIndex++;

    // Highlight du prénom dans le texte
    highlightName(el);

    // Scroll si besoin
    el.scrollTop = el.scrollHeight;

    const delay = ch === '\n' ? 120 : 38;
    setTimeout(typeNext, delay);
  }
  typeNext();
}

function highlightName(el){
  // Recomposer le texte et highlight (simple post-process)
  const raw = el.innerText;
  const regex = new RegExp(userName, 'gi');
  if(regex.test(raw)){
    const html = raw.replace(new RegExp(userName,'gi'), m=>`<span class="highlight">${m}</span>`);
    el.innerHTML = html;
    // Mettre le curseur à la fin
    const spans = el.querySelectorAll('span');
    if(spans.length){
      const last = spans[spans.length-1];
      last.scrollIntoView({block:'nearest'});
    }
  }
}


</script>
</body>
</html>
